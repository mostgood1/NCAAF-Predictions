services:
  - type: web
    name: ncaaf-frontend
    env: DATA_DIR=/opt/render/project/src/data
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT NCAFCompare.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
    plan: free
    autoDeploy: true
