services:
  - type: web
    name: ncaaf-frontend
    env: python
    plan: free
    autoDeploy: true
    buildCommand: |
      pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers=1 --threads=2 --timeout 60 wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /opt/render/project/src/data
